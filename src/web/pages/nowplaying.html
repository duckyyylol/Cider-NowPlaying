<!DOCTYPE html>

<head>
    <style>
        @import url("/public/styles/core.css");

        body {
            display: flex;
            flex-direction: row;
        }

        .inline {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 1em;
        }

        .inline .cover {
            width: 2.7em;
            height: 2.7em;
            border-radius: 100px;
        }

        .inline h1 {
            font-size: 1.7em;
        }

        .card {
            border-radius: var(--br);
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            max-width: 800px;
            max-height: 150px;
            width: auto !important;
            height: fit-content;
            background: #000000bd;
            filter: blur(1.1);
            padding: 0.5em 1.5em 0.5em 0.5em;
            gap: 2em;
        }

        .card .cover {
            max-width: 115px;
            aspect-ratio: 1/1;
            border-radius: var(--br);
        }

        .card h1 {
            width: 100%;
            line-height: 0.9em;
        }

        .card .title {
            font-size: 2em;
        }

        .card .artist {
            font-size: 1.3em;
        }

        .song-details {
            height: fit-content;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
        }
    </style>
</head>

<body>

    <div class="card">
        <img src="" class="cover">
        <div class="song-details">
            <h1 class="bold title"></h1>
            <h1 class="normal artist"></h1>
        </div>
    </div>
    <div class="inline">
        <img src="" class="cover">
        <h1 class="bold title"></h1>
        <h1 class="normal">-</h1>
        <h1 class="bold artist"></h1>
        <h1 class="normal album"></h1>
    </div>

    <script>
        function createPacket(command, data) {
            return JSON.stringify({ command, data, id: 0 });
        }

        function setTrack(track) {
            document.querySelectorAll(".title").forEach(e => {
                e.innerText = decodeURIComponent(track.title);
            })
            document.querySelectorAll(".artist").forEach(e => {
                e.innerText = decodeURIComponent(track.artist);
            })
            console.log((decodeURIComponent(track.artist).length + track?.album?.length) + "/75")
            if (track.album !== null && ((decodeURIComponent(track.artist).length + track?.album?.length) <= 75)) {
                document.querySelectorAll(".album").forEach(e => {
                    e.innerText = `[${decodeURIComponent(track.album)}]`;
                })
                document.querySelectorAll(".card .artist").forEach(e => {
                    e.innerText = `${decodeURIComponent(track.artist)} [${decodeURIComponent(track.album)}]`;
                })
            }
            if (track.imageUrl !== null) {
                document.querySelectorAll(".cover").forEach(e => {
                    e.setAttribute("src", track.imageUrl)
                })
            } else {
                document.querySelectorAll(".cover").forEach(e => {
                    e.setAttribute("src", "/public/img/album_cover.png")
                })
            }
        }

        function setInline(inl) {
            document.querySelector(".inline").style.display = inl ? "flex" : "none";
            document.querySelector(".card").style.display = inl ? "none" : "flex";
        }

        const searchParams = new URLSearchParams(location.search);
        const inline = searchParams.has("inline");
        setInline(inline);
        const left = !searchParams.has("right") && searchParams.has("left");
        const right = !left && searchParams.has("right");
        const middle = !left && !right;

        const align = left ? "left" : right ? "right" : middle ? "middle" : "middle";
        console.log("ALIGNMENT", align);

        document.querySelector(".inline").style.justifyContent = align === "left" ? "flex-start" : align === "right" ? "flex-end" : "center"
        document.querySelector("body").style.justifyContent = align === "left" ? "flex-start" : align === "right" ? "flex-end" : "center"

        const socket = new WebSocket("ws://localhost:12345");
        let authorized = false;

        let icecast = false;

        socket.addEventListener("message", ev => {
            const packet = JSON.parse(ev.data);
            if (!packet.command || !['hello', 'heartbeat', 'newTrack'].includes(packet.command)) return;
            console.log(packet.command)
            if (packet.command === "hello") {
                authorized = true;
                fetch("http://localhost:1234/api/tracks/nowplaying").then(r => r.json().then(currentTrack => {
                    setTrack(currentTrack.data)
                    console.log(currentTrack.data)
                }))
                socket.send(createPacket("hello", {}))
                console.log("Authenticating...")
            }

            if (packet.command === "newTrack" && authorized) {
                
                console.log(packet.data)
                if(packet.data?.title && packet.data?.artist) {
                    if(packet.data.imageUrl) {
                        icecast = false;
                        setTrack(packet.data);
                    } else if(packet.data?.title && !packet.data?.imageUrl) {
                        packet.data.imageUrl = "/public/img/album_cover.png"
                        icecast = true;
                        setTrack(packet.data);
                    }
                }
            }
        })
    </script>
</body>
