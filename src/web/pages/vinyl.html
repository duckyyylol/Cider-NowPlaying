<!DOCTYPE html>

<head>
    <style>
        @import url("/public/styles/core.css");

        .vinyl {
            transform: rotateX(10deg);
            animation-fill-mode: forwards;
            /* animation: rotating 10s linear infinite; */
        }

        #record {
            z-index: 0;
            position: absolute;
            top: 0%;
            left: 0%;
            /* border: 13px solid rgba(255, 155, 42, 0.2); */
            border-radius: 500px;
            margin: 0;
            /* animation: rotating 10s linear infinite; */
        }

        .plug {
            z-index: 2;
            position: absolute;
            top: calc(592.368px / 2.1);
            left: calc(592.368px / 2.1);
            /* animation: rotating 10s linear infinite; */
        }

        .cover {
            z-index: 1;
            position: absolute;
            width: 296.184px;
            height: 296.184px;
            border-radius: 200px;
            top: calc(592.368px / 3.8);
            left: calc(592.368px / 3.8);
            animation: rotating 10s linear infinite;
        }

        @-webkit-keyframes rotating {
            from {
                -webkit-transform: rotate(0deg);
                -o-transform: rotate(0deg);
                transform: rotate(0deg);
            }

            to {
                -webkit-transform: rotate(360deg);
                -o-transform: rotate(360deg);
                transform: rotate(360deg);
            }
        }

        @keyframes rotating {
            from {
                -ms-transform: rotate(0deg);
                -moz-transform: rotate(0deg);
                -webkit-transform: rotate(0deg);
                -o-transform: rotate(0deg);
                transform: rotate(0deg);
            }

            to {
                -ms-transform: rotate(360deg);
                -moz-transform: rotate(360deg);
                -webkit-transform: rotate(360deg);
                -o-transform: rotate(360deg);
                transform: rotate(360deg);
            }
        }

        @-webkit-keyframes loadOut {
            from {
                -ms-transform: translateY(0);
                -moz-transform: translateY(0);
                -webkit-transform: translateY(0);
                -o-transform: translateY(0);
                transform: translateY(0);
            }

            to {
                -ms-transform: translateY(-6000px) rotateX(270deg);
                -moz-transform: translateY(-6000px) rotateX(270deg);
                -webkit-transform: translateY(-6000px) rotateX(270deg);
                -o-transform: translateY(-6000px) rotateX(270deg);
                transform: translateY(-6000px) rotateX(270deg);
            }
        }

        @keyframes loadOut {
            from {
                -ms-transform: translateY(0);
                -moz-transform: translateY(0);
                -webkit-transform: translateY(0);
                -o-transform: translateY(0);
                transform: translateY(0);
            }

            to {
                -ms-transform: translateY(-6000px) rotateX(270deg);
                -moz-transform: translateY(-6000px) rotateX(270deg);
                -webkit-transform: translateY(-6000px) rotateX(270deg);
                -o-transform: translateY(-6000px) rotateX(270deg);
                transform: translateY(-6000px) rotateX(270deg);
            }
        }

        @-webkit-keyframes loadIn {
            from {
                -ms-transform: translateY(-6000px) rotateX(270deg);
                -moz-transform: translateY(-6000px) rotateX(270deg);
                -webkit-transform: translateY(-6000px) rotateX(270deg);
                -o-transform: translateY(-6000px) rotateX(270deg);
                transform: translateY(-6000px) rotateX(270deg);
            }

            to {
                -ms-transform: translateY(0) rotateX(0deg);
                -moz-transform: translateY(0) rotateX(0deg);
                -webkit-transform: translateY(0) rotateX(0deg);
                -o-transform: translateY(0) rotateX(0deg);
                transform: translateY(0) rotateX(0deg);
            }
        }

        @keyframes loadIn {
            from {
                -ms-transform: translateY(-6000px) rotateX(270deg);
                -moz-transform: translateY(-6000px) rotateX(270deg);
                -webkit-transform: translateY(-6000px) rotateX(270deg);
                -o-transform: translateY(-6000px) rotateX(270deg);
                transform: translateY(-6000px) rotateX(270deg);
            }

            to {
                -ms-transform: translateY(0) rotateX(0deg);
                -moz-transform: translateY(0) rotateX(0deg);
                -webkit-transform: translateY(0) rotateX(0deg);
                -o-transform: translateY(0) rotateX(0deg);
                transform: translateY(0) rotateX(0deg);
            }
        }
    </style>
</head>

    <script>
        let delay = ms => new Promise(res => setTimeout(res, ms));

        function createPacket(command, data) {
            return JSON.stringify({ command, data, id: 0 });
        }

        let trackId = null;

        async function setTrack(track) {
            if(trackId !== track.id) {
                if (track.imageUrl) {
                    const el = document.querySelector(".vinyl")
                    el.style.animation = `loadOut 2s ease forwards`;
                    await delay(500);
                    document.querySelector(".cover").setAttribute("src", track.imageUrl)
                    await delay(500);
                    el.style.animation = `loadIn 2s ease forwards`;
                    
                } else {
                    document.querySelectorAll(".cover").forEach(e => {
                        e.setAttribute("src", '/public/img/ducky.gif')
                    })
                }

                trackId = track.id;
            }
        }

        const searchParams = new URLSearchParams(location.search);

        const spin = (searchParams.has("spin") && !Number.isNaN(parseInt(searchParams.get("spin"))) && [0, 1].includes(parseInt(searchParams.get("spin")))) ? parseInt(searchParams.get("spin")) : 1;
        const spinEnabled = searchParams.has("spin")

        if (spinEnabled) {
            document.querySelectorAll(".cover").forEach(e => {
                e.style.animation = `rotating 10s linear infinite`;
                e.style.animationDirection = spin === 0 ? "reverse" : "normal";
            })
        }

        const socket = new WebSocket("ws://localhost:12345");
        let authorized = false;
        let id = null;
        let icecast = false;

        socket.addEventListener("message", async ev => {
            const packet = JSON.parse(ev.data);
            if (!packet.command || !['hello', 'heartbeat', 'newTrack'].includes(packet.command)) return;
            console.log(packet.command)
            if (packet.command === "hello") {
                authorized = true;
                fetch("http://localhost:1234/api/tracks/nowplaying").then(r => r.json().then(async ({ data: currentTrack }) => {
                    if (currentTrack.imageUrl !== null) { setTrack(currentTrack) } else {
                        document.querySelector(".cover").setAttribute("src", "/public/img/album_cover.png")
                        document.querySelector(".plug").style.visibility = "hidden";
                    }
                    id = currentTrack.id;
                }))
                socket.send(createPacket("hello", {}))
                console.log("Authenticating...")
            }

            if (packet.command === "newTrack" && authorized) {
                console.log(packet.data)
                if (packet.data?.title) {
                    console.log("CURRENT TRACK ID", id)
                    if (packet.data.imageUrl && packet.data.id !== id) {
                        await setTrack(packet.data); id = packet.data.id; icecast = false;
                        document.querySelector(".plug").style.visibility = "visible";

                    } else if(packet.data?.title && !packet.data?.imageUrl) {
                        packet.data.imageUrl = "/public/img/album_cover.png"
                        if (!icecast) { await setTrack(packet.data); id = packet.data.id; icecast = true; }
                    }
                }
            }
        })
    </script>
